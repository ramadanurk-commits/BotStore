<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Business</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui;margin:0;color:#192441;background:#f8f9ff}header,main,footer{max-width:1000px;margin:auto;padding:30px}header{display:flex;justify-content:space-between}select{padding:8px;border-radius:6px;border:1px solid #ddd}section{padding:65px 0}h1{font-size:clamp(35px,6vw,64px);line-height:1.2;max-width:700px}h2{font-size:30px}.button{display:inline-block;background:#5c50e8;color:white;padding:14px 24px;border-radius:9px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{padding:25px;background:white;border:1px solid #e5e6f0;border-radius:15px}.muted{color:#727b91}footer{border-top:1px solid #e5e6f0}</style><header><b id="brand"></b><select id="lang" aria-label="Language"><option value="kk">ҚАЗ</option><option value="ru">РУС</option><option value="en">ENG</option></select></header><main id="main"></main><footer id="footer"></footer><script>
// EDIT your real business name, phone, address and prices below before publishing.
const config={name:'My Business',phone:'',address:'',services:[{kk:'Бірінші қызмет',ru:'Первая услуга',en:'First service',price:'5 000 ₸'},{kk:'Екінші қызмет',ru:'Вторая услуга',en:'Second service',price:'10 000 ₸'}]};
const texts={kk:['Сапалы қызмет. Жеке көзқарас.','Бізбен байланысып, өзіңізге ыңғайлы уақытты таңдаңыз.','Қызметтер','WhatsApp арқылы жазылу','Байланыс','Телефонды config ішінде енгізіңіз'],ru:['Качественный сервис. Личный подход.','Свяжитесь с нами и выберите удобное время.','Услуги','Записаться в WhatsApp','Контакты','Укажите телефон в config'],en:['Quality service. A personal touch.','Contact us to choose a time that works for you.','Services','Book via WhatsApp','Contact','Add your phone number in config']};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const l=document.getElementById('lang').value,t=texts[l];document.documentElement.lang=l;document.title=config.name;document.getElementById('brand').textContent=config.name;const phone=config.phone.replace(/\D/g,'');document.getElementById('main').innerHTML='<section><p class="muted">'+esc(config.name)+'</p><h1>'+t[0]+'</h1><p class="muted">'+t[1]+'</p>'+(phone?'<a class="button" rel="noopener" href="https://wa.me/'+phone+'">'+t[3]+'</a>':'<p>'+t[5]+'</p>')+'</section><section><h2>'+t[2]+'</h2><div class="grid">'+config.services.map(s=>'<article class="card"><h3>'+esc(s[l])+'</h3><b>'+esc(s.price)+'</b></article>').join('')+'</div></section><section><h2>'+t[4]+'</h2><p>'+esc(config.phone)+'</p><p>'+esc(config.address)+'</p></section>';document.getElementById('footer').textContent='© '+new Date().getFullYear()+' '+config.name;}
document.getElementById('lang').onchange=render;render();</script></html>
